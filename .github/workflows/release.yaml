name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-latest

    defaults:
      run:
        working-directory: Codebase

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Determine version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build Apple Silicon binary
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          GOOS=darwin GOARCH=arm64 go build \
            -trimpath \
            -ldflags="-s -w -X main.VERSION=$VERSION" \
            -o macventory \
            .

          tar -czf macventory-darwin-arm64.tar.gz macventory
          rm macventory

      - name: Build Intel binary
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          GOOS=darwin GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w -X main.VERSION=$VERSION" \
            -o macventory \
            .

          tar -czf macventory-darwin-amd64.tar.gz macventory
          rm macventory

      - name: Generate checksums
        run: |
          shasum -a 256 \
            macventory-darwin-arm64.tar.gz \
            macventory-darwin-amd64.tar.gz \
            > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            macventory-darwin-arm64.tar.gz \
            macventory-darwin-amd64.tar.gz \
            checksums.txt \
            --title "Macventory $GITHUB_REF_NAME" \
            --generate-notes